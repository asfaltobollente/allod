id: cloud
tier: optional
provides: [file-sync]
conflicts: []
platforms: [amd64, arm64]

levels:
  off:
    ram_mb: 0
  basic:
    ram_mb: 200
    requires:
      modules: [storage]
    grants: [Sincronizzazione file da desktop e mobile, condivisione link, database SQLite leggero]
    lacks: [editing collaborativo, calendario, contatti, sync multi-utente intensivo]
  standard:
    ram_mb: 600
    requires:
      modules: [storage]
    grants: [Sincronizzazione massiva multi-utente, database PostgreSQL dedicato, calendario, contatti, note]
    lacks: [editing collaborativo in tempo reale Office / Collabora]

ports:
  - n: 8443
    container_port: 80
    scope: mesh
    share: member

privileges:
  userns: rootless
  devices: []
  caps: []

images:
  - ref: docker.io/nextcloud
    tag: stable
    channel: patch
  - ref: docker.io/library/postgres
    tag: "16-alpine"
    channel: patch

update:
  requires_release_notes: true
  pre_hook: occ-maintenance
  breaks_mobile_apps: true

transitions:
  off -> basic: safe
  off -> standard: safe
  basic -> standard: safe
  standard -> basic: safe
  basic -> off: destructive
  standard -> off: destructive

datasets:
  - id: cloud
    includes: [data, db-dump]
    excludes: [cache, preview]

help:
  en: help/cloud.en.md
  it: help/cloud.it.md
