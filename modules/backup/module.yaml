id: backup
tier: core
provides: [federated-backup]
conflicts: []
platforms: [amd64, arm64]

levels:
  off:
    ram_mb: 0
  peers:
    ram_mb: 150
    requires:
      modules: [storage]
    grants: [Ricezione backup cifrati dei nodi amici (rest-server append-only su porta 8000), archiviazione snapshot immutabili]
    lacks: []

ports:
  - n: 8000
    scope: mesh
    share: friend

privileges:
  userns: rootless
  devices: []
  caps: []

images:
  - ref: docker.io/restic/rest-server
    tag: 0.12.1
    channel: pinned
    args: ["/usr/bin/rest-server", "--append-only", "--no-auth", "--path", "/data"]

update:
  requires_release_notes: false
  breaks_mobile_apps: false

transitions:
  off -> peers: safe
  peers -> off: safe

datasets:
  - id: backup
    includes: [data]

help:
  en: help/backup.en.md
  it: help/backup.it.md
