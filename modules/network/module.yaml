id: network
tier: recommended
provides: [vpn-mesh, remote-access]
conflicts: []
platforms: [amd64, arm64]

levels:
  off:
    ram_mb: 0
  cloud:
    ram_mb: 40
    requires:
      modules: [storage]
    grants: [Accesso remoto sicuro WireGuard tramite NetBird Cloud Europeo (Francoforte), zero porte aperte]
  selfhosted:
    ram_mb: 40
    requires:
      modules: [storage]
    grants: [Accesso remoto sicuro WireGuard tramite NetBird Server Self-Hosted sovrano]

ports: []

privileges:
  userns: rootless
  devices: [/dev/net/tun]
  caps: [NET_ADMIN]

images:
  - ref: docker.io/netbirdio/netbird
    tag: "0.79.0"
    channel: patch

update:
  requires_release_notes: false
  breaks_mobile_apps: false

transitions:
  off -> cloud: safe
  cloud -> off: safe
  off -> selfhosted: safe
  selfhosted -> off: safe
  cloud -> selfhosted: safe
  selfhosted -> cloud: safe

datasets:
  - id: network
    includes: [config]

help:
  en: help/network.en.md
  it: help/network.it.md
