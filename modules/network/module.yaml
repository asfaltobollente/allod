id: network
tier: recommended
provides: [vpn-mesh, remote-access]
conflicts: []
platforms: [amd64, arm64]

levels:
  off:
    ram_mb: 0
  cloud:
    ram_mb: 40
    requires:
      modules: [storage]
    grants: [Accesso remoto sicuro WireGuard tramite NetBird Cloud Europeo (Francoforte), zero porte aperte]
  selfhosted:
    ram_mb: 40
    requires:
      modules: [storage]
    grants: [Accesso remoto sicuro WireGuard tramite NetBird Server Self-Hosted remoto/VPS]
  selfhosted_remote:
    ram_mb: 40
    requires:
      modules: [storage]
    grants: [Accesso remoto sicuro WireGuard tramite NetBird Server Self-Hosted remoto/VPS]
  selfhosted_managed:
    ram_mb: 250
    requires:
      modules: [storage]
    grants: [Server di coordinamento NetBird sovrano locale in container gestito Allod + Client mesh]

ports:
  - n: 33073
    scope: lan
  - n: 8088
    scope: lan
  - n: 3478
    scope: lan

privileges:
  userns: rootless
  devices: [/dev/net/tun]
  caps: [NET_ADMIN]

images:
  - ref: docker.io/netbirdio/netbird
    tag: "0.79.0"
    channel: patch
  - ref: docker.io/netbirdio/netbird-server
    tag: "0.79.0"
    channel: patch
  - ref: docker.io/netbirdio/dashboard
    tag: "latest"
    channel: patch

update:
  requires_release_notes: false
  breaks_mobile_apps: false

transitions:
  off -> cloud: safe
  cloud -> off: safe
  off -> selfhosted: safe
  selfhosted -> off: safe
  cloud -> selfhosted: safe
  selfhosted -> cloud: safe
  off -> selfhosted_remote: safe
  selfhosted_remote -> off: safe
  cloud -> selfhosted_remote: safe
  selfhosted_remote -> cloud: safe
  off -> selfhosted_managed: safe
  selfhosted_managed -> off: safe
  cloud -> selfhosted_managed: safe
  selfhosted_managed -> cloud: safe
  selfhosted -> selfhosted_managed: safe
  selfhosted_managed -> selfhosted: safe
  selfhosted_remote -> selfhosted_managed: safe
  selfhosted_managed -> selfhosted_remote: safe

datasets:
  - id: network
    includes: [config]

help:
  en: help/network.en.md
  it: help/network.it.md
