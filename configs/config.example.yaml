node:
    name: allod-node-01
    channel: stable
    group: git+ssh://git@my-allod-ring/ring.git
catalog:
    source: https://dl.allod.dev/catalog/v1.json
    mode: online
people:
    - id: owner
      role: owner
      quota_gb: 500
    - id: member-01
      role: member
      quota_gb: 300
    - id: member-02
      role: member
      quota_gb: 100
modules:
    backup:
        level: peers
    cloud:
        level: basic
    media:
        level: "off"
    network:
        level: hybrid
    photos:
        level: standard
    shares:
        level: basic
    storage:
        level: raid1
        disks:
            - DISK-SERIAL-01
            - DISK-SERIAL-02
    watch:
        level: federated
